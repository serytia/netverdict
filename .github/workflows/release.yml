# Publie sur PyPI via trusted publishing (OIDC) : aucun token a stocker.
# Declencheurs : push d'un tag v* — ou lancement manuel depuis l'onglet Actions
# (utile quand le tag existait avant ce workflow, comme v0.6.0).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Idempotent : republier une version deja en ligne n'est plus une
          # erreur, c'est un non-evenement. Sans cela, tout tag pose apres coup
          # sur une version deja publiee - ou un simple `workflow_dispatch`,
          # que ce workflow prevoit explicitement - se soldait par un run
          # ROUGE et une alerte, alors que rien d'anormal ne s'etait produit.
          # PyPI refuse de toute facon d'ecraser un fichier existant : c'est
          # LUI qui garantit l'immuabilite, pas l'echec du run.
          skip-existing: true

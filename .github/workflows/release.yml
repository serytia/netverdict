# Publie sur PyPI via trusted publishing (OIDC) : aucun token a stocker.
# Declencheurs : push d'un tag v* — ou lancement manuel depuis l'onglet Actions
# (utile quand le tag existait avant ce workflow, comme v0.6.0).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

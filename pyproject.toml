[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netverdict"
version = "0.5.0"
description = "Triage d'incident reseau/app/OS : analyse une capture et rend un verdict argumente avec preuves"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-2.0-only" }
authors = [{ name = "rhnetwork" }]
keywords = ["pcap", "tcp", "network", "troubleshooting", "sysadmin",
            "packet-analysis", "incident-response", "sysmon", "auditd"]
# Ce que la page PyPI affiche comme preuve de support : sans ces lignes, un
# admin qui hesite ne voit ni les versions de Python, ni le fait que l'outil
# tourne ailleurs que sur la machine de son auteur.
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: System :: Systems Administration",
    "Topic :: Security",
    "Natural Language :: French",
]

dependencies = [
    # dpkt et non pyshark/tshark : parseur 100 % Python -> aucune dependance
    # systeme (Wireshark absent de la plupart des serveurs qu'on analyse).
    # On reimplemente le petit sous-ensemble d'analyse TCP dont on a besoin,
    # c'est le coeur de la valeur de l'outil, pas un cout accidentel.
    "dpkt>=1.9.8",
    "rich>=13.0",
    "pyyaml>=6.0",
    # Windows n'embarque PAS la base IANA : sans tzdata, --syslog-tz
    # Europe/Paris echoue apres un `pip install` nu, alors que l'aide et le
    # README annoncent ce format au meme rang que les autres.
    "tzdata; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/serytia/netverdict"
Repository = "https://github.com/serytia/netverdict"
Issues = "https://github.com/serytia/netverdict/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# La couche --explain (API Claude) est un extra : l'outil complet fonctionne
# sans, et un poste d'admin sans cle API n'a pas a tirer le SDK.
explain = ["anthropic>=0.60"]
# Lecture directe des .evtx binaires. Sans cet extra, --events accepte
# toujours l'export XML wevtutil (natif Windows, zero dependance).
evtx = ["python-evtx>=0.8"]

[project.scripts]
netverdict = "netverdict.cli:main"

[tool.setuptools.packages.find]
include = ["netverdict*"]

[tool.setuptools.package-data]
# capture/ est du contenu LIVRE, pas de l'outillage de depot : la sous-commande
# `netverdict capture` l'execute. Son absence du wheel cassait la commande pour
# tout utilisateur installe alors qu'elle est annoncee dans l'aide. Le dossier
# vit sous netverdict/ pour cette raison — setuptools ne sait pas embarquer un
# repertoire situe hors du paquet.
netverdict = ["rules/*.yaml", "capture/*.ps1", "capture/*.sh", "capture/*.xml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

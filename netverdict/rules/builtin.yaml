# Regles de verdict embarquees — v1.
#
# Philosophie (heritee des packs Wazuh du meme auteur) :
#   - une regle = de la donnee declarative, pas du code
#   - la description interpolee EST la phrase de preuve montree a l'admin
#   - la remediation est REDIGEE A LA MAIN : jamais generee, jamais vague
#   - les seuils sont commentes avec leur justification — un seuil sans
#     justification est un seuil qu'on n'osera jamais modifier
#
# Verdicts : RESEAU | APP | OS | HOTE (app-ou-OS indiscernable sans snapshot)
#            | AMBIGU | RAS
# Priorite : plus haut = affiche en premier ; les autres matches restent
#            visibles comme signaux secondaires.
#
# TRADUCTIONS : `title`/`evidence`/`remediation` portent le francais ;
# `title_en`/`evidence_en`/`remediation_en` portent l'anglais. Un champ _en
# absent retombe sur le francais (aucune erreur). Les accolades d'un gabarit
# `evidence` doivent etre IDENTIQUES dans les deux langues : load_rules eprouve
# les deux, une faute de frappe explose au chargement.
# `verdict` et `confidence` ne se traduisent PAS : ce sont des identifiants.

rules:

  # ---------------------------------------------------------------- filtrage
  - id: reject-icmp
    verdict: RESEAU
    priority: 92
    confidence: haute
    title: "Connexion REFUSEE explicitement par un equipement (REJECT)"
    when:
      all:
        - "icmp_admin_prohibited == true"
    evidence:
      - "ICMP administratively-prohibited emis par {icmp_admin_prohibited_from} pour {client}:{cport} -> {server}:{sport}"
    remediation: |
      L'equipement {icmp_admin_prohibited_from} refuse ce trafic par politique
      (REJECT). Ce n'est ni l'application ni le serveur : la regle de filtrage
      est sur CET equipement. Chercher dans sa configuration la regle qui
      matche ce couple source/destination/port, et verifier si le refus est
      voulu (durcissement recent ?) ou une regle trop large.
    title_en: "Connection explicitly REFUSED by a device (REJECT)"
    evidence_en:
      - "ICMP administratively-prohibited sent by {icmp_admin_prohibited_from} for {client}:{cport} -> {server}:{sport}"
    remediation_en: |
      Device {icmp_admin_prohibited_from} is refusing this traffic by policy
      (REJECT). This is neither the application nor the server: the filtering
      rule lives on THAT device. Find the rule matching this
      source/destination/port triple in its configuration, and check whether
      the refusal is intended (recent hardening?) or a rule that is too broad.

  # SYN sans SYN/ACK, mais avec des ICMP unreachable rattaches. Situation
  # DIFFERENTE du silence complet : un equipement ou l'hote a explicitement
  # signale l'injoignabilite. La regle existe parce que syn-no-answer affirmait
  # « aucun ICMP » dans ce cas — une preuve contredite par le pcap lui-meme.
  - id: syn-no-answer-icmp-unreach
    verdict: RESEAU
    priority: 91
    confidence: haute
    title: "SYN sans reponse, mais ICMP unreachable recus : destination injoignable signalee"
    when:
      all:
        - "syn_count >= 2"
        - "synack_seen == false"
        - "rst_to_syn == false"
        - "icmp_unreach_count >= 1"
    unless:
      # Un REJECT explicite est plus precis : reject-icmp raconte mieux.
      - "icmp_admin_prohibited == true"
    evidence:
      - "{syn_count} SYN de {client} vers {server}:{sport} etales sur {syn_span_s:.1f}s — aucun SYN/ACK, mais {icmp_unreach_count} ICMP unreachable rattache(s) au flux"
    remediation: |
      Contrairement a un DROP silencieux, quelque chose a REPONDU : un ICMP
      unreachable. Cela restreint fortement le champ :
      1. Lire le type/code exact de l'ICMP et son emetteur (--json) : c'est lui
         qui designe l'equipement ou l'hote qui declare l'injoignabilite.
      2. Si l'emetteur est un routeur : route absente ou interface down en aval.
      3. Si l'emetteur est {server} lui-meme : l'hote est la mais le port ou le
         protocole est ferme au niveau IP (host/port unreachable).
      4. Verifier la resolution/ARP du dernier saut avant {server}.
    title_en: "SYN unanswered, but ICMP unreachable received: destination reported as unreachable"
    evidence_en:
      - "{syn_count} SYN from {client} to {server}:{sport} spread over {syn_span_s:.1f}s — no SYN/ACK, but {icmp_unreach_count} ICMP unreachable attached to the flow"
    remediation_en: |
      Unlike a silent DROP, something DID answer: an ICMP unreachable. That
      narrows the field a lot:
      1. Read the exact ICMP type/code and its sender (--json): the sender is
         the device or host declaring the destination unreachable.
      2. If the sender is a router: missing route or a downstream interface
         that is down.
      3. If the sender is {server} itself: the host is up, but the port or the
         protocol is closed at IP level (host/port unreachable).
      4. Check name resolution/ARP on the last hop before {server}.

  - id: syn-no-answer
    verdict: RESEAU
    priority: 90
    confidence: haute
    title: "SYN sans aucune reponse : filtrage silencieux (DROP) ou hote injoignable"
    when:
      all:
        # 2 SYN et plus = au moins ~1 s de retries : ce n'est pas une capture
        # arretee trop tot, c'est un vrai silence.
        - "syn_count >= 2"
        - "synack_seen == false"
        - "rst_to_syn == false"
        # La preuve ci-dessous AFFIRME « aucun ICMP ». La regle ne doit donc pas
        # matcher quand des ICMP unreachable ont ete rattaches, sinon le rapport
        # contredit le pcap qu'il vient de lire (revue du 25/07/2026). Ce cas a
        # sa propre regle : syn-no-answer-icmp-unreach, juste au-dessus.
        - "icmp_unreach_count == 0"
    unless:
      # Si un REJECT explicite existe, la regle reject-icmp raconte mieux.
      - "icmp_admin_prohibited == true"
    evidence:
      - "{syn_count} SYN de {client} vers {server}:{sport} etales sur {syn_span_s:.1f}s — aucun SYN/ACK, aucun RST, aucun ICMP"
    remediation: |
      Quelque chose sur le chemin jette les SYN sans repondre (politique DROP),
      ou l'hote est injoignable. Verifier dans l'ordre :
      1. Firewall local de {server} (profil actif, regle d'entree sur le port {sport})
      2. Firewalls/ACL intermediaires sur le chemin aller
      3. Route de RETOUR depuis {server} (asymetrie : l'aller passe, le retour
         part ailleurs) — verifier la table de routage cote serveur
      4. L'hote repond-il a autre chose (ICMP, autre port) ? Si non : probleme
         de joignabilite (down, ARP, VLAN), pas de filtrage.
    title_en: "SYN with no answer at all: silent filtering (DROP) or unreachable host"
    evidence_en:
      - "{syn_count} SYN from {client} to {server}:{sport} spread over {syn_span_s:.1f}s — no SYN/ACK, no RST, no ICMP"
    remediation_en: |
      Something on the path is dropping the SYN without answering (DROP
      policy), or the host is unreachable. Check in this order:
      1. Local firewall on {server} (active profile, inbound rule on port {sport})
      2. Intermediate firewalls/ACLs on the forward path
      3. RETURN route from {server} (asymmetry: the request gets through, the
         reply leaves elsewhere) — check the routing table on the server side
      4. Does the host answer anything else (ICMP, another port)? If not, this
         is a reachability problem (down, ARP, VLAN), not filtering.

  - id: rst-to-syn
    verdict: APP
    priority: 88
    confidence: haute
    title: "RST en reponse au SYN : rien n'ecoute sur ce port"
    when:
      all:
        - "rst_to_syn == true"
    evidence:
      - "RST recu {rst_to_syn_ms:.1f} ms apres le SYN vers {server}:{sport}"
    remediation: |
      Le reseau fonctionne : le SYN est arrive et une pile TCP a repondu.
      Mais aucun service n'ecoute sur {server}:{sport}. Verifier sur le serveur :
      1. Le service est-il demarre ? (etat du process/service)
      2. Ecoute-t-il sur le bon port et la bonne interface ?
         (ss -tlnp / netstat -ano — un bind sur 127.0.0.1 au lieu de 0.0.0.0
         est le classique du genre)
      3. Un RST peut aussi venir d'un firewall en mode reject-with-rst :
         si le service ecoute bel et bien, chercher un REJECT sur le chemin.
    title_en: "RST in reply to the SYN: nothing is listening on that port"
    evidence_en:
      - "RST received {rst_to_syn_ms:.1f} ms after the SYN to {server}:{sport}"
    remediation_en: |
      The network works: the SYN arrived and a TCP stack answered. But no
      service is listening on {server}:{sport}. On the server, check:
      1. Is the service running? (process/service state)
      2. Is it listening on the right port and the right interface?
         (ss -tlnp / netstat -ano — a bind on 127.0.0.1 instead of 0.0.0.0
         is the classic case)
      3. A RST can also come from a firewall in reject-with-rst mode: if the
         service really is listening, look for a REJECT on the path.

  - id: mtu-blackhole
    verdict: RESEAU
    priority: 86
    confidence: haute
    title: "Probleme de MTU sur le chemin (fragmentation requise)"
    when:
      all:
        - "icmp_frag_needed == true"
    evidence:
      - "ICMP 'fragmentation needed' recu pour le flux {client}:{cport} -> {server}:{sport}"
    remediation: |
      Un lien du chemin a une MTU plus petite (tunnel VPN, PPPoE, IPsec...) et
      les gros segments ne passent pas. Symptome typique : la connexion
      s'etablit, les petits echanges marchent, tout gele des qu'un gros
      transfert demarre. Corriger par clamp du MSS sur l'equipement de tunnel
      (ex : 1360 pour de l'IPsec) ou MTU coherente de bout en bout.
    title_en: "MTU problem on the path (fragmentation needed)"
    evidence_en:
      - "ICMP 'fragmentation needed' received for flow {client}:{cport} -> {server}:{sport}"
    remediation_en: |
      A link on the path has a smaller MTU (VPN tunnel, PPPoE, IPsec...) and
      large segments do not get through. Typical symptom: the connection is
      established, small exchanges work, and everything freezes as soon as a
      large transfer starts. Fix it by clamping the MSS on the tunnel device
      (e.g. 1360 for IPsec) or by using a consistent MTU end to end.

  - id: zero-window-server
    verdict: HOTE
    priority: 85
    confidence: haute
    title: "Le serveur ne lit plus sa socket (zero window) : app ou OS sature"
    when:
      all:
        # Une annonce isolee de quelques ms arrive dans la vie normale d'un
        # buffer ; 100 ms fenetre fermee = l'application n'a pas consomme
        # pendant 100 ms, ce n'est plus du reglage fin.
        #
        # DUREE PAR SENS, jamais l'agregat : quand les DEUX hotes annoncent du
        # zero-window (banal sur un transfert bidirectionnel sature), zw_max_ms
        # porte le maximum des deux cotes. Cette regle accusait alors le
        # serveur avec la duree du CLIENT : mauvais hote, preuve fausse, et
        # l'admin part fouiller la machine innocente (revue du 25/07/2026).
        - "zw_from_server >= 1"
        - "zw_max_ms_from_server >= 100"
    evidence:
      - "{zw_from_server} annonces zero-window de {server}, fenetre fermee jusqu'a {zw_max_ms_from_server:.0f} ms (cumul {zw_total_ms_from_server:.0f} ms)"
    remediation: |
      Le RESEAU EST HORS DE CAUSE : il a livre, c'est {server} qui ne consomme
      pas. La socket du service n'est pas lue assez vite. Cote serveur,
      au moment de l'incident :
      1. CPU du process qui detient le port {sport} (thread bloque ? GC ?)
      2. I/O disque (l'app qui ecrit de façon synchrone sur un disque sature
         arrete de lire sa socket)
      3. Swap / pression memoire.
      Le snapshot hote de 'netverdict capture' donne exactement ces elements.
    title_en: "The server has stopped reading its socket (zero window): saturated app or OS"
    evidence_en:
      - "{zw_from_server} zero-window advertisements from {server}, window closed for up to {zw_max_ms_from_server:.0f} ms (total {zw_total_ms_from_server:.0f} ms)"
    remediation_en: |
      THE NETWORK IS NOT AT FAULT: it delivered, and {server} is not
      consuming. The service is not reading its socket fast enough. On the
      server side, at the time of the incident, check:
      1. CPU of the process holding port {sport} (blocked thread? GC?)
      2. Disk I/O (an app writing synchronously to a saturated disk stops
         reading its socket)
      3. Swap / memory pressure.
      The host snapshot from 'netverdict capture' gives exactly these figures.

  - id: slow-app-proven
    verdict: APP
    priority: 84
    confidence: haute
    title: "Reponse applicative lente, reception prouvee par ACK rapide"
    when:
      all:
        - "handshake_complete == true"
        - "exchanges >= 1"
        - "ttfb_ms_p95 >= 500"
        # La preuve est un RAPPORT, pas un seuil absolu : l'acquittement TCP est
        # bien plus rapide que la reponse, donc le delai est DANS le serveur.
        # L'ancien « server_ack_delay_ms_p95 < 50 » laissait passer entre les
        # mailles un cas pourtant evident — ACK a 60 ms, reponse a 900 ms (15x) —
        # que plus AUCUNE regle ne matchait : le flux ressortait « anodin »
        # (revue du 25/07/2026). Le rapport de 5 couvre ce cas sans affaiblir la
        # preuve, et le plafond absolu ci-dessous garde la borne de bon sens.
        - "ttfb_over_ack_ratio >= 5"
        - "server_ack_delay_ms_p95 < 250"
        - "retrans_rate < 0.01"
    evidence:
      - "{exchanges} echanges : ACK serveur en {server_ack_delay_ms_p95:.0f} ms mais reponse en {ttfb_ms_p50:.0f} ms (p50) / {ttfb_ms_p95:.0f} ms (p95), 0 perte"
    remediation: |
      Le reseau a livre la requete (ACK immediat) puis a attendu l'application.
      Chercher COTE APPLICATIF de {server}:{sport} :
      1. Temps de traitement interne (logs applicatifs au meme timestamp)
      2. Dependances aval : base de donnees, API tierce, resolution DNS
         faite PAR le serveur — le blocage est souvent un cran derriere
      3. Pool de threads/connexions epuise (requetes en file d'attente).
    title_en: "Slow application response, reception proven by a fast ACK"
    evidence_en:
      - "{exchanges} exchanges: server ACK in {server_ack_delay_ms_p95:.0f} ms but response in {ttfb_ms_p50:.0f} ms (p50) / {ttfb_ms_p95:.0f} ms (p95), 0 loss"
    remediation_en: |
      The network delivered the request (immediate ACK) and then waited for
      the application. Look on the APPLICATION SIDE of {server}:{sport}:
      1. Internal processing time (application logs at the same timestamp)
      2. Downstream dependencies: database, third-party API, DNS resolution
         done BY the server — the stall is often one hop further back
      3. Exhausted thread/connection pool (requests queuing up).

  - id: zero-window-client
    verdict: HOTE
    priority: 83
    confidence: haute
    title: "Le client ne lit plus sa socket (zero window) : poste/app cliente saturee"
    when:
      all:
        # Duree cote CLIENT uniquement, meme raison que zero-window-server.
        - "zw_from_client >= 1"
        - "zw_max_ms_from_client >= 100"
    evidence:
      - "{zw_from_client} annonces zero-window de {client}, fenetre fermee jusqu'a {zw_max_ms_from_client:.0f} ms"
    remediation: |
      C'est le POSTE CLIENT qui n'absorbe pas ce que le serveur envoie
      (application cliente bloquee, machine saturee). Le reseau et le serveur
      sont hors de cause. Verifier la charge du poste {client} et l'etat de
      l'application au moment des plaintes.
    title_en: "The client has stopped reading its socket (zero window): saturated workstation or client app"
    evidence_en:
      - "{zw_from_client} zero-window advertisements from {client}, window closed for up to {zw_max_ms_from_client:.0f} ms"
    remediation_en: |
      It is the CLIENT WORKSTATION that is not absorbing what the server
      sends (blocked client application, saturated machine). Neither the
      network nor the server is at fault. Check the load on {client} and the
      state of the application at the time of the complaints.

  - id: retrans-heavy
    verdict: RESEAU
    priority: 80
    confidence: haute
    title: "Perte de paquets significative sur le chemin"
    when:
      all:
        # 3 % : un LAN sain vit sous 0.1 % ; a 3 % le debit s'effondre
        # (TCP divise sa fenetre a chaque perte). Le plancher de 5 retrans
        # evite de flagger 1 perte isolee sur un petit flux.
        - "retrans_rate >= 0.03"
        - "retrans_total >= 5"
    evidence:
      - "{retrans_total} retransmissions sur {pkts_total} paquets ({retrans_rate:.1%}) — c2s: {retrans_c2s}, s2c: {retrans_s2c}"
      - "Rafales de dup-ACK : client {dup_ack_bursts_from_client}, serveur {dup_ack_bursts_from_server}"
    remediation: |
      Il y a de la perte sur le chemin. Le sens des retransmissions dit ou
      chercher (c2s = perte vers le serveur, s2c = perte vers le client).
      Causes classiques par ordre de frequence :
      1. Lien sature (uplink, interco) : verifier l'utilisation des interfaces
      2. Erreurs physiques : compteurs CRC/errors des switchs sur le chemin,
         duplex mismatch, cable/SFP fatigue
      3. Wi-Fi ou lien radio dans le chemin
      4. Equipement qui drop en limite de capacite (CPU firewall, QoS).
    title_en: "Significant packet loss on the path"
    evidence_en:
      - "{retrans_total} retransmissions out of {pkts_total} packets ({retrans_rate:.1%}) — c2s: {retrans_c2s}, s2c: {retrans_s2c}"
      - "Dup-ACK bursts: client {dup_ack_bursts_from_client}, server {dup_ack_bursts_from_server}"
    remediation_en: |
      There is loss on the path. The direction of the retransmissions says
      where to look (c2s = loss towards the server, s2c = loss towards the
      client). Usual causes, most frequent first:
      1. Saturated link (uplink, interconnect): check interface utilisation
      2. Physical errors: CRC/error counters on the switches along the path,
         duplex mismatch, worn cable/SFP
      3. Wi-Fi or a radio link on the path
      4. A device dropping at its capacity limit (firewall CPU, QoS).

  - id: slow-app-likely
    verdict: APP
    priority: 78
    confidence: moyenne
    title: "Reponse applicative lente (sans preuve ACK separee)"
    when:
      all:
        - "handshake_complete == true"
        - "exchanges >= 1"
        - "ttfb_ms_p95 >= 500"
        - "retrans_rate < 0.01"
        # Pas d'ACK pur observe avant la reponse (ACK piggyback) : on ne peut
        # pas prouver que le delai est dans l'app, mais zero perte + transport
        # propre rendent le reseau tres improbable.
        - "server_ack_delay_ms_p95 == none"
    evidence:
      - "{exchanges} echanges, reponse en {ttfb_ms_p50:.0f} ms (p50) / {ttfb_ms_p95:.0f} ms (p95), transport propre (0 perte, RTT p50 {rtt_ms_p50:.1f} ms)"
    remediation: |
      Le transport est propre (pas de perte, RTT stable) mais la reponse est
      lente : la cause la plus probable est applicative. Pour transformer la
      probabilite en preuve : recapturer COTE SERVEUR ('netverdict capture'
      sur le serveur) — si le delai y est identique, c'est l'app ; s'il
      disparait, chercher entre les deux points de capture.
    title_en: "Slow application response (no separate ACK to prove it)"
    evidence_en:
      - "{exchanges} exchanges, response in {ttfb_ms_p50:.0f} ms (p50) / {ttfb_ms_p95:.0f} ms (p95), clean transport (0 loss, RTT p50 {rtt_ms_p50:.1f} ms)"
    remediation_en: |
      Transport is clean (no loss, stable RTT) but the response is slow: the
      most likely cause is the application. To turn that probability into
      proof, re-capture ON THE SERVER SIDE ('netverdict capture' on the
      server) — if the delay is the same there, it is the app; if it
      disappears, look between the two capture points.

  - id: rtt-degraded
    verdict: RESEAU
    priority: 70
    confidence: moyenne
    title: "Latence instable : gigue forte (congestion probable)"
    when:
      all:
        # Jugee sur la MEDIANE, jamais sur le p95 : le p95 est pollue par les
        # delayed ACK (~40-200 ms), fait deja documente en limite connue, et
        # quelques ACK differes suffisaient a rendre un verdict RESEAU sur un
        # probleme purement applicatif (revue du 25/07/2026).
        #
        # MESURE sur les pcaps du lab, qui a corrige deux idees fausses :
        #   jitter (netem reel) : p50 28-96 ms, ratio 361-1169, ZERO perte
        #   clean               : p50 0.0-0.9 ms, ratio jusqu'a 62 (!)
        #   slow_app            : p50 0.0 ms,    ratio 3.9-8.1
        # 1) Le RATIO SEUL ne discrimine rien : sur un LAN le minimum est
        #    sub-milliseconde, donc n'importe quel rapport explose — 'clean'
        #    atteint 62. C'est la valeur ABSOLUE de la mediane qui separe.
        # 2) Une gigue reelle ne laisse AUCUNE trace de perte : exiger une
        #    corroboration par retransmission ou dup-ACK faisait rater le
        #    scenario netem du lab. Idee abandonnee, mesure en main.
        - "rtt_ms_min > 0"
        - "rtt_ms_p50 >= 20"
        - "rtt_ratio_p50_min >= 4"
    evidence:
      - "RTT min {rtt_ms_min:.1f} ms mais p95 {rtt_ms_p95:.1f} ms (x{rtt_ratio_p95_min:.0f}) sur {pkts_total} paquets"
    remediation: |
      Le chemin existe et fonctionne, mais sa latence explose par moments :
      files d'attente qui se remplissent (congestion, bufferbloat), lien
      partage sature par un autre trafic, ou equipement en limite CPU.
      Croiser l'horaire des pics avec les graphes d'utilisation des liens.
    title_en: "Unstable latency: heavy jitter (congestion likely)"
    evidence_en:
      - "RTT min {rtt_ms_min:.1f} ms but p95 {rtt_ms_p95:.1f} ms (x{rtt_ratio_p95_min:.0f}) over {pkts_total} packets"
    remediation_en: |
      The path exists and works, but its latency spikes at times: queues
      filling up (congestion, bufferbloat), a shared link saturated by other
      traffic, or a device at its CPU limit. Cross-check the timing of the
      spikes against link utilisation graphs.

  - id: rst-midstream
    verdict: AMBIGU
    priority: 65
    confidence: moyenne
    title: "Session coupee net (RST) en plein travail"
    when:
      all:
        - "rst_midstream == true"
    evidence:
      - "RST emis par {rst_emitter} apres echanges etablis ({bytes_c2s}o c2s / {bytes_s2c}o s2c, duree {duration_s:.1f}s)"
    remediation: |
      Une session qui travaillait a ete tuee. Trois familles de causes :
      1. Timeout d'inactivite d'un equipement a etats (firewall, NAT, LB) :
         typique si la coupure survient apres une periode calme — comparer
         la duree d'idle avec les timeouts configures
      2. IPS/inspection qui a decide de couper (verifier ses logs a ce
         timestamp exact)
      3. Crash ou restart du process en face (logs systeme/app du cote qui
         a emis le RST).
      Le cote emetteur du RST ({rst_emitter}) dit ou commencer.
    title_en: "Session cut short (RST) while it was working"
    evidence_en:
      - "RST sent by {rst_emitter} after established exchanges ({bytes_c2s}B c2s / {bytes_s2c}B s2c, duration {duration_s:.1f}s)"
    remediation_en: |
      A working session was killed. Three families of causes:
      1. Idle timeout on a stateful device (firewall, NAT, LB): typical if
         the cut happens after a quiet period — compare the idle duration
         with the configured timeouts
      2. IPS/inspection that decided to cut (check its logs at that exact
         timestamp)
      3. Crash or restart of the process on the other end (system/app logs on
         the side that sent the RST).
      The side that sent the RST ({rst_emitter}) says where to start.

  - id: latency-tail-unexplained
    verdict: AMBIGU
    priority: 25
    confidence: faible
    title: "Pics de latence que la capture ne sait pas attribuer"
    when:
      all:
        - "handshake_complete == true"
        # Mediane saine, donc rtt-degraded (priorite 70) ne couvre pas ce cas.
        # C'est AUSSI cette condition qui met les WAN a latence uniformement
        # elevee hors de portee de cette regle — un lien stable a 80 ms a une
        # mediane de 80 ms et ne peut pas matcher ici.
        - "rtt_ms_p50 < 20"
        # Queue ABSOLUE significative. Mesure du lab : tous les flux sains
        # plafonnent a 1,41 ms de p95, tous les flux netem degrades demarrent a
        # 29 ms. Trois ordres de grandeur separent les deux familles.
        - "rtt_ms_p95 >= 20"
        # ...et c'est bien une QUEUE, pas un plateau : un lien stable a 19,9 ms
        # de mediane et 20 ms de p95 franchit le seuil absolu ci-dessus sans
        # avoir le moindre pic. Voila ce que cette condition protege — et NON le
        # WAN a 80 ms, deja exclu par la mediane (rationnel corrige apres
        # mesure : le commentaire precedent nommait la mauvaise garde).
        #
        # Seuil a 2 et non 5 : mesure du 25/07/2026, un flux a mediane 15 ms et
        # p95 60 ms (x4) ressortait « sain » avec un seuil a 5. Une queue de
        # 60 ms sur une mediane de 15 ms est une vraie queue.
        - "rtt_ratio_p95_p50 >= 2"
    evidence:
      - "RTT median {rtt_ms_p50:.1f} ms mais p95 {rtt_ms_p95:.1f} ms (x{rtt_ratio_p95_p50:.0f}) : la latence pique sans que la capture puisse dire pourquoi"
    remediation: |
      DEUX CAUSES produisent exactement cette signature et cette capture ne
      permet PAS de les separer — d'ou le verdict ambigu plutot qu'un
      diagnostic reseau qui aurait une chance sur deux d'etre faux :

      1. GIGUE DU CHEMIN (files d'attente, lien partage, equipement en limite).
      2. DELAYED ACK du recepteur : un timer de 40 ms (Linux) a 200 ms
         (Windows) retarde des ACK purs. Le chemin est alors hors de cause.

      POUR TRANCHER, dans l'ordre de cout :
      1. Un `ping -i 0.2` de 60 s vers {server} pendant l'incident : si la
         gigue apparait aussi en ICMP, c'est le chemin. Sinon c'est le timer.
      2. Dans la capture, regarder si les RTT longs sont portes par des ACK
         PURS (sans donnees) : signature du delayed ACK.
      3. Comparer avec un autre flux vers une destination differente sur le
         meme chemin : gigue partagee = chemin.

      Ne PAS ouvrir de ticket operateur sur ce seul element.
    title_en: "Latency spikes the capture cannot attribute"
    evidence_en:
      - "Median RTT {rtt_ms_p50:.1f} ms but p95 {rtt_ms_p95:.1f} ms (x{rtt_ratio_p95_p50:.0f}): latency spikes without the capture being able to say why"
    remediation_en: |
      TWO CAUSES produce exactly this signature and this capture CANNOT
      separate them — hence an ambiguous verdict rather than a network
      diagnosis that would have a one-in-two chance of being wrong:

      1. PATH JITTER (queues, shared link, device at its limit).
      2. DELAYED ACK on the receiver: a timer of 40 ms (Linux) to 200 ms
         (Windows) holds back pure ACKs. The path is then not at fault.

      TO DECIDE, in order of cost:
      1. A 60 s `ping -i 0.2` towards {server} during the incident: if the
         jitter also shows up in ICMP, it is the path. Otherwise it is the
         timer.
      2. In the capture, check whether the long RTTs are carried by PURE ACKs
         (no data): that is the delayed-ACK signature.
      3. Compare with another flow to a different destination over the same
         path: shared jitter = the path.

      Do NOT open a carrier ticket on this evidence alone.

  - id: clean
    verdict: RAS
    priority: 10
    confidence: haute
    title: "Transport sain : le probleme n'est pas dans cette conversation reseau"
    when:
      all:
        - "handshake_complete == true"
        - "retrans_rate < 0.01"
        - "zw_from_client == 0"
        - "zw_from_server == 0"
        - "rst_midstream == false"
        - any:
            - "exchanges == 0"
            - "ttfb_ms_p95 < 500"
        # La regle ne regardait AUCUNE mesure de latence : un flux a mediane
        # 15 ms et p95 400 ms ressortait « transport sain » — un faux « tout va
        # bien », la panne la plus couteuse pour un outil de diagnostic, car
        # elle envoie l'admin chercher ailleurs (mesure du 25/07/2026).
        # Les deux formes conjointes, jamais le ratio seul : sous la
        # milliseconde un rapport n'a aucun sens (clean.pcap atteint x64 en
        # etant parfaitement sain).
        # Strictement complementaire de latency-tail-unexplained (meme seuils),
        # sinon un flux tombe entre les deux regles et ressort « AMBIGU, pas
        # assez d'elements » alors que la mesure disait quelque chose.
        - any:
            - "rtt_ms_p95 < 20"
            - "rtt_ratio_p95_p50 < 2"
    evidence:
      - "Handshake {handshake_rtt_ms:.1f} ms, {pkts_total} pqts, pertes {retrans_rate:.2%}, TTFB p95 {ttfb_ms_p95:.0f} ms"
    remediation: |
      Rien d'anormal au niveau transport sur ce flux. Si l'utilisateur se
      plaint quand meme : le probleme est au-dessus de TCP (erreurs HTTP
      applicatives, contenu, authentification) ou sur un AUTRE flux que
      celui-ci (dependance cachee : DNS, proxy, service tiers) — verifier
      les autres conversations de la capture.
    title_en: "Healthy transport: the problem is not in this network conversation"
    evidence_en:
      - "Handshake {handshake_rtt_ms:.1f} ms, {pkts_total} pkts, loss {retrans_rate:.2%}, TTFB p95 {ttfb_ms_p95:.0f} ms"
    remediation_en: |
      Nothing abnormal at transport level on this flow. If the user is still
      complaining, the problem is above TCP (application-level HTTP errors,
      content, authentication) or on ANOTHER flow than this one (hidden
      dependency: DNS, proxy, third-party service) — check the other
      conversations in the capture.
